<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Markdown Editor</title>

    <!--
        All third-party assets are pinned to exact versions and protected with
        Subresource Integrity hashes. They are served by jsDelivr straight from
        the npm tarballs, so the hashes can be regenerated from `npm pack`.
    -->

    <!-- Parser, Sanitizer, Highlighter -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js" integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js" integrity="sha384-wjfDDhOPPdjtva8vWBhWeVprSpmxisEu5aYT3q1JyACqXpdKpo3PWZTMVq24MBix" crossorigin="anonymous"></script>
    <!-- Both highlight themes stay loaded; applyTheme() switches them via `media` (print always uses the light one) -->
    <link rel="stylesheet" id="hljs-light" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous">
    <link rel="stylesheet" id="hljs-dark" media="not all" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous">

    <!-- CodeMirror 5 Base -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.css" integrity="sha384-bsaAhvdduZPAwUb7RRLRvDgtEtOsggrgjkr/EjPO1i/vdoi+DmdLaG79UOt6M5hD" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/theme/monokai.css" integrity="sha384-TvEldXruOSfbCQy2x7urguD4uK2Pd6WSyfNEJ6DxgYUTkxlJi/Wr3VD1x9mHwDn2" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/lib/codemirror.js" integrity="sha384-YbR2n4zUtdAz2YuqQsJFpjrgTl5SPEm0NG+y8/y3R63tAWTA3O7TOyIWyYYcqUqU" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/mode/markdown/markdown.js" integrity="sha384-+DgrmBJvzFFizEu8fQ9BvzcKDPhSyCyRuotcIQIwwtlN+3G+PEqcojPeRE9KhS7u" crossorigin="anonymous"></script>

    <!-- CodeMirror 5 Search & Replace Add-ons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/addon/dialog/dialog.css" integrity="sha384-md19vSE9P4AgqWc2VTrqi+l5aPSvW1m6Fojz+kEpMvFCgZfSY7TB8vcUp6o6ncKU" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/addon/dialog/dialog.js" integrity="sha384-FV8vL89nnU1VWPuHBUuUYCYWH8ozli0A7PAY8C7CJd4oRDnQZ80UNPQjXcRp6mfq" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/addon/search/searchcursor.js" integrity="sha384-Fb0JQymUnTS6/ObRqQC2jFewjRP/5GdhVYdNSrgR5LhWLaTDi2OPvCRqoJlRGrDm" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.21/addon/search/search.js" integrity="sha384-YOqVmw4q7LIontAg+aAO3ue2A9YlY53lFxQyY4JnsmE1/Wdv4NEvyMa04z7nffwb" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #f4f4f5;
            --header-bg: #ffffff;
            --border-color: #e4e4e7;
            --text-main: #27272a;
            --text-muted: #71717a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --export-btn: #10b981;
            --export-btn-hover: #059669;
            --success: #10b981;
        }

        body.dark-mode {
            --bg-color: #18181b;
            --header-bg: #27272a;
            --border-color: #3f3f46;
            --text-main: #e4e4e7;
            --text-muted: #a1a1aa;
        }

        body, html {
            margin: 0; padding: 0; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--header-bg); padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }

        .header-divider { border-left: 1px solid var(--border-color); margin: 0 4px; height: 24px; }
        #themeBtn { margin-left: auto; }
        #status { margin-left: 10px; font-size: 0.9rem; font-weight: 500; color: var(--success); }
        #status.error { color: var(--danger); }

        input[type="text"] {
            padding: 0.5rem; font-size: 1rem;
            border: 1px solid var(--border-color); border-radius: 4px;
            background: var(--header-bg); color: var(--text-main); width: 180px;
        }

        button {
            padding: 0.5rem 1rem; font-size: 0.9rem; font-family: inherit;
            border: none; border-radius: 4px;
            background-color: var(--accent); color: white;
            cursor: pointer; transition: background 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }
        button.btn-danger { background-color: var(--danger); }
        button.btn-danger:hover { background-color: var(--danger-hover); }
        button.btn-export { background-color: var(--export-btn); }
        button.btn-export:hover { background-color: var(--export-btn-hover); }
        button.btn-secondary { background-color: var(--header-bg); color: var(--text-main); border: 1px solid var(--border-color); }
        button.btn-secondary:hover { background-color: var(--bg-color); }
        button.btn-icon { background: none; color: var(--text-muted); padding: 0.25rem 0.75rem; font-size: 1.1rem; }
        button.btn-icon:hover { color: var(--danger); background: none; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        #sidebarToggle { display: none; }

        .workspace { display: flex; flex: 1; overflow: hidden; min-height: 0; }

        .workspace.view-edit-only .preview-pane { display: none; }
        .workspace.view-edit-only .resizer { display: none; }
        /* A width set by dragging the resizer only applies to the split view */
        .workspace.view-edit-only .editor-container { flex: 1 !important; width: auto !important; }
        .workspace.view-preview-only .editor-container { display: none; }
        .workspace.view-preview-only .resizer { display: none; }

        .sidebar {
            width: 250px; background-color: var(--header-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar h3 { margin: 1rem; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        .shortcuts { padding: 1rem; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border-color); }

        .doc-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .doc-item {
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: stretch;
        }
        .doc-item.active { background-color: var(--bg-color); border-left: 3px solid var(--accent); }
        .doc-item.active .doc-name { padding-left: calc(1rem - 3px); }
        .doc-item:hover { background-color: var(--bg-color); }
        .doc-item button.doc-name {
            flex: 1; min-width: 0; padding: 0.75rem 1rem; text-align: left;
            background: none; color: inherit; border-radius: 0; font-size: 1rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .doc-item button.doc-name:focus-visible { outline-offset: -2px; }

        .editor-container { flex: 1; display: flex; flex-direction: column; min-width: 200px; min-height: 0; }
        .CodeMirror { flex: 1; height: 100%; font-family: 'Courier New', monospace; font-size: 15px; }

        .CodeMirror-dialog { background: var(--header-bg); color: var(--text-main); }
        .CodeMirror-dialog input { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); }

        .resizer {
            width: 5px; background-color: var(--border-color);
            cursor: col-resize; transition: background 0.2s; flex-shrink: 0;
            touch-action: none;
        }
        .resizer:hover, .resizer.active { background-color: var(--accent); }
        body.resizing { cursor: col-resize; user-select: none; -webkit-user-select: none; }

        .preview-pane {
            /* position: relative makes the pane the offsetParent used for scroll sync */
            position: relative;
            flex: 1; padding: 2rem; background-color: var(--bg-color);
            overflow-y: auto; line-height: 1.6; min-width: 200px; min-height: 0;
        }

        .preview-pane img { max-width: 100%; border-radius: 4px; }
        .preview-pane code { background: rgba(128,128,128,0.2); padding: 2px 4px; border-radius: 4px; }
        .preview-pane pre code { background: transparent; padding: 0; }
        .preview-pane blockquote { border-left: 4px solid var(--border-color); margin-left: 0; padding-left: 1rem; color: var(--text-muted); }
        .preview-pane .preview-error { color: var(--danger); }

        #drop-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(59, 130, 246, 0.9); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.2s; text-align: center; padding: 1rem;
        }
        body.drag-over #drop-overlay { opacity: 1; pointer-events: all; }

        /* Narrow screens: sidebar becomes a toggleable panel, panes stack vertically */
        @media (max-width: 768px) {
            header { padding: 0.5rem; gap: 6px; }
            header input[type="text"] { flex: 1 1 140px; width: auto; }
            button { padding: 0.4rem 0.7rem; }
            #sidebarToggle { display: inline-block; }
            #themeBtn { margin-left: 0; }
            .header-divider { display: none; }

            .workspace { flex-direction: column; }
            .sidebar { display: none; width: auto; max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            body.sidebar-open .sidebar { display: flex; }
            .sidebar h3 { margin: 0.5rem 1rem; }
            .shortcuts { display: none; }
            .resizer { display: none !important; }
            .editor-container { flex: 1 !important; width: auto !important; min-width: 0; }
            .workspace:not(.view-edit-only):not(.view-preview-only) .editor-container { border-bottom: 1px solid var(--border-color); }
            .preview-pane { min-width: 0; padding: 1rem; }
        }

        /* "Export PDF" prints the rendered preview only, always in light colours */
        @page { margin: 0.5in; }
        @media print {
            body, body.dark-mode {
                --bg-color: #ffffff; --header-bg: #ffffff; --border-color: #d4d4d8;
                --text-main: #000000; --text-muted: #52525b;
            }
            html, body { height: auto; overflow: visible; display: block; background: #ffffff; }
            header, .sidebar, .editor-container, .resizer, #drop-overlay { display: none !important; }
            .workspace { display: block; overflow: visible; }
            .preview-pane { display: block !important; overflow: visible; padding: 0; }
            .preview-pane pre, .preview-pane blockquote, .preview-pane table, .preview-pane img { break-inside: avoid; }
            .preview-pane h1, .preview-pane h2, .preview-pane h3, .preview-pane h4, .preview-pane h5, .preview-pane h6 { break-after: avoid; }
        }
    </style>
</head>
<body>

    <header>
        <button id="sidebarToggle" onclick="toggleSidebar()" class="btn-secondary" aria-label="Show documents" aria-expanded="false" aria-controls="sidebar">☰</button>
        <input type="text" id="filename" placeholder="Document Name" value="Untitled" aria-label="Document name">
        <button onclick="newDocument()">New</button>
        <button onclick="manualSave()">Save</button>
        <button onclick="deleteCurrent()" class="btn-danger">Delete</button>

        <span class="header-divider"></span>

        <button onclick="downloadDocument()" class="btn-export">Export .md</button>
        <button onclick="exportPDF()" class="btn-export" title="Opens the print dialog. Choose &quot;Save as PDF&quot; as the destination.">Export PDF</button>
        <button onclick="exportBackup()" class="btn-export" title="Download every document as a JSON backup. Drop the file back onto the app to restore it.">Backup all</button>

        <span class="header-divider"></span>

        <button id="viewToggleBtn" onclick="toggleView()" class="btn-secondary" title="Cycle Editor Views">👁️ View: Split</button>
        <button id="themeBtn" onclick="toggleDarkMode()" class="btn-secondary" aria-label="Toggle Theme">🌓 Theme</button>
        <span id="status" role="status" aria-live="polite"></span>
    </header>

    <div class="workspace" id="workspace">
        <div class="sidebar" id="sidebar">
            <h3>Documents</h3>
            <ul class="doc-list" id="docList"></ul>
            <div class="shortcuts">
                <strong>Shortcuts:</strong><br>
                Ctrl/⌘+S: Save<br>
                Ctrl/⌘+F: Find<br>
                Shift+Ctrl/⌘+F: Replace<br>
            </div>
        </div>

        <div class="editor-container" id="editorPane">
            <textarea id="editor"></textarea>
        </div>

        <div class="resizer" id="resizer"></div>

        <div class="preview-pane" id="preview"></div>
    </div>

    <div id="drop-overlay">Drop a .md file to open it, or a backup .json to restore</div>

    <script>
        // --- 1. Initialization & State ---
        const preview = document.getElementById('preview');
        const filenameInput = document.getElementById('filename');
        const docList = document.getElementById('docList');
        const statusSpan = document.getElementById('status');
        const workspace = document.getElementById('workspace');
        const viewToggleBtn = document.getElementById('viewToggleBtn');
        const editorPane = document.getElementById('editorPane');
        const sidebar = document.getElementById('sidebar');
        const resizer = document.getElementById('resizer');

        let currentDocId = null;
        let isDirty = false;
        let editVersion = 0; // Bumped on every edit so a save only clears isDirty if nothing changed meanwhile
        let isSaving = false;
        let externalChange = false; // Current doc was saved/deleted in another tab while we had unsaved edits
        let suppressRender = false; // Prevents setValue() from triggering render
        let statusTimeout; // Manages UI notification races
        let viewState = parseInt(localStorage.getItem('viewState')) || 0;

        // Theme is resolved before the editor exists so both start out matching
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
        const storedTheme = localStorage.getItem('theme');
        const startDark = storedTheme ? storedTheme === 'dark' : systemDark.matches;

        const cmEditor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            mode: 'markdown',
            lineNumbers: true,
            theme: startDark ? 'monokai' : 'default',
            lineWrapping: true,
            extraKeys: {
                "Ctrl-F": "findPersistent",
                "Cmd-F": "findPersistent",
                "Shift-Ctrl-F": "replace",
                "Shift-Cmd-F": "replace"
            }
        });

        applyTheme(startDark);
        systemDark.addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) applyTheme(e.matches);
        });

        // Open links from the preview in a new tab instead of navigating away from the editor
        if (window.DOMPurify) {
            DOMPurify.addHook('afterSanitizeAttributes', (node) => {
                if (node.tagName === 'A' && node.hasAttribute('href') && !node.getAttribute('href').startsWith('#')) {
                    node.setAttribute('target', '_blank');
                    node.setAttribute('rel', 'noopener noreferrer');
                }
            });
        }

        // Global Save Override (capture phase, so it also wins while CodeMirror has focus)
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                manualSave();
            }
        }, true);

        // Tab Closure Protection
        window.addEventListener('beforeunload', (e) => {
            if (isDirty) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        function markDirty() {
            isDirty = true;
            editVersion++;
        }

        // Replace the editor contents without counting it as a user edit
        function setEditorContent(text) {
            suppressRender = true;
            cmEditor.setValue(text);
            cmEditor.clearHistory(); // Undo must not reach back into the previous document
            suppressRender = false;
            clearTimeout(renderTimeout);
            renderPreview();
            isDirty = false;
        }

        // --- 2. Core Rendering Engine ---
        // Each top-level block is tagged with the editor line it came from, which drives scroll sync.
        function renderPreview() {
            if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
                preview.innerHTML = '<p class="preview-error">Preview unavailable: the Markdown libraries failed to load. Check your connection and reload.</p>';
                return;
            }

            const source = cmEditor.getValue();
            const tokens = marked.lexer(source);
            let html = '';
            let cursor = 0, line = 0;

            for (const token of tokens) {
                let out = marked.parser([token]);
                const idx = token.raw ? source.indexOf(token.raw, cursor) : -1;
                if (idx !== -1) {
                    const end = idx + token.raw.length;
                    for (let i = cursor; i < idx; i++) if (source.charCodeAt(i) === 10) line++;
                    if (token.type !== 'html' && token.type !== 'space') {
                        out = out.replace(/^(\s*<[a-z][\w-]*)/i, `$1 data-source-line="${line}"`);
                    }
                    for (let i = idx; i < end; i++) if (source.charCodeAt(i) === 10) line++;
                    cursor = end;
                }
                html += out;
            }

            preview.innerHTML = DOMPurify.sanitize(html);

            // Scoped specifically to the preview pane for minor performance gain
            if (window.hljs) {
                preview.querySelectorAll('pre code').forEach((block) => hljs.highlightElement(block));
            }

            if (viewState === 0) syncPreviewToEditor();
        }

        let renderTimeout;
        cmEditor.on('change', () => {
            if (suppressRender) return;
            markDirty();
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(renderPreview, 300);
        });

        filenameInput.addEventListener('input', markDirty);

        // --- 3. Scroll Sync (both directions, mapped through source lines) ---
        const ignoreScrollUntil = { editor: 0, preview: 0 };

        // Anchor points pairing an editor line with a preview offset
        function getScrollAnchors() {
            const pad = parseFloat(getComputedStyle(preview).paddingTop) || 0;
            const anchors = [{ line: 0, top: 0 }];
            for (const el of preview.children) {
                const line = Number(el.dataset.sourceLine);
                if (!Number.isFinite(line)) continue;
                const top = Math.max(0, el.offsetTop - pad);
                const last = anchors[anchors.length - 1];
                if (line < last.line || top < last.top) continue;
                if (line === last.line) { last.top = Math.min(last.top, top); continue; }
                anchors.push({ line, top });
            }
            anchors.push({
                line: cmEditor.lineCount(),
                top: Math.max(anchors[anchors.length - 1].top, preview.scrollHeight - preview.clientHeight)
            });
            return anchors;
        }

        function interpolate(anchors, from, to, value) {
            let i = 0;
            while (i < anchors.length - 2 && anchors[i + 1][from] <= value) i++;
            const a = anchors[i], b = anchors[i + 1];
            const span = b[from] - a[from];
            return a[to] + (span > 0 ? (value - a[from]) / span : 0) * (b[to] - a[to]);
        }

        function syncPreviewToEditor() {
            const info = cmEditor.getScrollInfo();
            let target;
            if (info.top + info.clientHeight >= info.height - 2) {
                target = preview.scrollHeight;
            } else {
                const line = cmEditor.lineAtHeight(info.top, 'local');
                const lineTop = cmEditor.heightAtLine(line, 'local');
                const lineHeight = cmEditor.heightAtLine(line + 1, 'local') - lineTop;
                const pos = line + (lineHeight > 0 ? (info.top - lineTop) / lineHeight : 0);
                target = interpolate(getScrollAnchors(), 'line', 'top', pos);
            }
            ignoreScrollUntil.preview = performance.now() + 100;
            preview.scrollTop = target;
        }

        function syncEditorToPreview() {
            const info = cmEditor.getScrollInfo();
            let target;
            if (preview.scrollTop + preview.clientHeight >= preview.scrollHeight - 2) {
                target = info.height;
            } else {
                const pos = interpolate(getScrollAnchors(), 'top', 'line', preview.scrollTop);
                const line = Math.floor(pos);
                const lineTop = cmEditor.heightAtLine(line, 'local');
                target = lineTop + (pos - line) * (cmEditor.heightAtLine(line + 1, 'local') - lineTop);
            }
            ignoreScrollUntil.editor = performance.now() + 100;
            cmEditor.scrollTo(null, target);
        }

        cmEditor.on('scroll', () => {
            if (viewState !== 0 || performance.now() < ignoreScrollUntil.editor) return;
            syncPreviewToEditor();
        });

        preview.addEventListener('scroll', () => {
            if (viewState !== 0 || performance.now() < ignoreScrollUntil.preview) return;
            syncEditorToPreview();
        });

        setInterval(() => { if (isDirty && !isSaving) saveDocument(true); }, 10000);

        // --- 4. View Management ---
        function toggleView() {
            viewState = (viewState + 1) % 3;
            localStorage.setItem('viewState', viewState);
            applyViewState(viewState);
        }

        function applyViewState(state) {
            workspace.classList.remove('view-edit-only', 'view-preview-only');
            if (state === 1) {
                workspace.classList.add('view-edit-only');
                viewToggleBtn.textContent = "👁️ View: Edit";
            } else if (state === 2) {
                workspace.classList.add('view-preview-only');
                viewToggleBtn.textContent = "👁️ View: Preview";
            } else {
                viewToggleBtn.textContent = "👁️ View: Split";
            }
            setTimeout(() => {
                cmEditor.refresh();
                if (state === 0) syncPreviewToEditor();
            }, 10);
        }

        const narrowScreen = window.matchMedia('(max-width: 768px)');

        function toggleSidebar(open = !document.body.classList.contains('sidebar-open')) {
            document.body.classList.toggle('sidebar-open', open);
            document.getElementById('sidebarToggle').setAttribute('aria-expanded', String(open));
        }

        // --- 5. Split Pane Resizing ---
        let isResizing = false;

        function setEditorWidth(px) {
            const max = workspace.clientWidth - sidebar.offsetWidth - resizer.offsetWidth - 200;
            const width = Math.max(150, Math.min(px, max));
            editorPane.style.flex = "none";
            editorPane.style.width = `${width}px`;
        }

        const savedWidth = parseInt(localStorage.getItem('editorWidth'));
        if (savedWidth) setEditorWidth(savedWidth);
        applyViewState(viewState);

        window.addEventListener('resize', () => {
            if (editorPane.style.width && viewState === 0 && !narrowScreen.matches) {
                setEditorWidth(parseInt(editorPane.style.width));
            }
        });

        resizer.addEventListener('pointerdown', (e) => {
            if (viewState !== 0) return;
            e.preventDefault(); // Prevents text selection while dragging
            isResizing = true;
            resizer.setPointerCapture(e.pointerId);
            resizer.classList.add('active');
            document.body.classList.add('resizing');
        });
        resizer.addEventListener('pointermove', (e) => {
            if (!isResizing) return;
            setEditorWidth(e.clientX - editorPane.getBoundingClientRect().left);
        });
        function stopResizing() {
            if (!isResizing) return;
            isResizing = false;
            resizer.classList.remove('active');
            document.body.classList.remove('resizing');
            localStorage.setItem('editorWidth', editorPane.style.width);
            cmEditor.refresh();
        }
        resizer.addEventListener('pointerup', stopResizing);
        resizer.addEventListener('pointercancel', stopResizing);

        // --- 6. Database Setup ---
        const dbName = "MarkdownAppDB";
        const storeName = "documents";
        let db;

        const request = indexedDB.open(dbName, 1);

        request.onerror = (e) => {
            console.error("IndexedDB Error:", e);
            showStatus("Database failed to load", true);
        };

        request.onblocked = () => {
            alert("Database upgrade blocked. Please close other tabs of this application.");
        };

        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains(storeName)) {
                // Future-proofing: creating an index on updatedAt
                const store = db.createObjectStore(storeName, { keyPath: "id" });
                store.createIndex("updatedAt", "updatedAt", { unique: false });
            }
        };

        request.onsuccess = (e) => {
            db = e.target.result;

            db.onversionchange = () => {
                db.close();
                db = null;
                console.warn("Database closed due to version change in another tab.");
                showStatus("Database closed by another tab. Reload to keep saving.", true);
            };

            loadDocumentList();
            const lastDocId = localStorage.getItem('lastDocId');
            if (lastDocId) openDocument(lastDocId, { force: true });
            else newDocument(true);
        };

        // Keep other open tabs of the app in step with saves and deletes
        const channel = 'BroadcastChannel' in window ? new BroadcastChannel('markdown-app') : null;

        function notifyOtherTabs(message) {
            if (channel) channel.postMessage(message);
        }

        if (channel) {
            channel.onmessage = ({ data }) => {
                loadDocumentList();
                const affectsCurrent = data.id === currentDocId || (data.ids && data.ids.includes(currentDocId));
                if (!currentDocId || !affectsCurrent) return;

                if (isDirty) {
                    externalChange = true;
                    showStatus(data.type === 'deleted' ? "Deleted in another tab" : "Changed in another tab", true);
                } else if (data.type === 'deleted') {
                    newDocument(true);
                    showStatus("Deleted in another tab");
                } else {
                    openDocument(currentDocId, { force: true, keepView: true, status: "Updated from another tab" });
                }
            };
        }

        // --- 7. Document Management ---
        // Only exported file names need filesystem-safe characters; stored names are kept as typed
        function sanitizeFilename(name) {
            return name.replace(/[<>:"/\\|?*\x00-\x1F]/g, '_').trim() || 'Untitled';
        }

        function cleanDocName(name) {
            return name.trim() || 'Untitled';
        }

        function newId() {
            // crypto.randomUUID() only exists in secure contexts (https, localhost, file://)
            return crypto.randomUUID ? crypto.randomUUID()
                : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
        }

        function newDocument(force = false) {
            if (!force && isDirty && !confirm("You have unsaved changes. Start new anyway?")) return;
            currentDocId = null;
            externalChange = false;
            localStorage.removeItem('lastDocId');
            filenameInput.value = "Untitled";
            setEditorContent("");
            updateActiveSidebarItem();
            showStatus("New document");
        }

        function manualSave() { saveDocument(false); }

        function saveDocument(isAuto = false, message) {
            if (!db || isSaving) return;

            if (externalChange && currentDocId) {
                if (isAuto) {
                    showStatus("Changed in another tab. Save manually to overwrite.", true);
                    return;
                }
                if (!confirm("This document was changed or deleted in another tab. Overwrite it with your version?")) return;
            }

            isSaving = true;
            try {
                const isNewDoc = !currentDocId;
                const savedVersion = editVersion;
                const doc = {
                    id: currentDocId || newId(),
                    name: cleanDocName(filenameInput.value),
                    content: cmEditor.getValue(),
                    updatedAt: Date.now()
                };
                currentDocId = doc.id;
                // Rewriting the input mid-typing would move the caret, so only do it on explicit saves
                if (!isAuto) filenameInput.value = doc.name;

                const tx = db.transaction([storeName], "readwrite");

                tx.oncomplete = () => {
                    isSaving = false;
                    if (doc.id === currentDocId) {
                        externalChange = false;
                        if (editVersion === savedVersion) isDirty = false;
                        localStorage.setItem('lastDocId', doc.id);
                    }
                    showStatus(message || (isAuto ? "Auto-saved" : "Saved"));
                    notifyOtherTabs({ type: 'saved', id: doc.id });
                    requestPersistentStorage();

                    const li = document.getElementById(`sidebar-${doc.id}`);
                    if (isNewDoc || !li) {
                        loadDocumentList();
                    } else {
                        li.querySelector('.doc-name').textContent = doc.name;
                        docList.prepend(li);
                    }
                };

                // Errors on the request bubble up and abort the transaction, so onabort covers both
                tx.onabort = () => {
                    isSaving = false;
                    console.error("Save failed", tx.error);
                    showStatus("Error saving document", true);
                };

                tx.objectStore(storeName).put(doc);
            } catch (err) {
                isSaving = false;
                console.error("Save failed", err);
                showStatus("Error saving document", true);
            }
        }

        function loadDocumentList() {
            if (!db) return;
            const tx = db.transaction([storeName], "readonly");
            const store = tx.objectStore(storeName);

            // Utilizing the index if available (graceful fallback if upgraded from old version)
            const request = store.indexNames.contains("updatedAt")
                ? store.index("updatedAt").getAll()
                : store.getAll();

            request.onsuccess = (e) => {
                const docs = e.target.result.sort((a, b) => b.updatedAt - a.updatedAt);
                docList.innerHTML = "";
                docs.forEach(doc => {
                    const li = document.createElement('li');
                    li.className = 'doc-item';
                    li.id = `sidebar-${doc.id}`;

                    const openBtn = document.createElement('button');
                    openBtn.className = 'doc-name';
                    openBtn.textContent = doc.name;
                    openBtn.onclick = () => {
                        openDocument(doc.id);
                        if (narrowScreen.matches) toggleSidebar(false);
                    };

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-icon';
                    delBtn.textContent = '×';
                    delBtn.title = "Delete";
                    delBtn.setAttribute('aria-label', `Delete ${doc.name}`);
                    delBtn.onclick = (event) => {
                        event.stopPropagation();
                        deleteDocument(doc.id, doc.name);
                    };

                    li.appendChild(openBtn);
                    li.appendChild(delBtn);
                    docList.appendChild(li);
                });
                updateActiveSidebarItem();
            };
        }

        function updateActiveSidebarItem() {
            document.querySelectorAll('.doc-item').forEach(el => {
                el.classList.remove('active');
                el.querySelector('.doc-name').removeAttribute('aria-current');
            });
            if (currentDocId) {
                const activeItem = document.getElementById(`sidebar-${currentDocId}`);
                if (activeItem) {
                    activeItem.classList.add('active');
                    activeItem.querySelector('.doc-name').setAttribute('aria-current', 'true');
                }
            }
        }

        function openDocument(id, { force = false, keepView = false, status = "Loaded" } = {}) {
            if (!db) return;
            if (!force && isDirty && !confirm("You have unsaved changes. Open different file anyway?")) return;

            const req = db.transaction([storeName], "readonly").objectStore(storeName).get(id);
            req.onsuccess = () => {
                const doc = req.result;
                if (!doc) {
                    // Stale lastDocId, or deleted in another tab
                    newDocument(true);
                    loadDocumentList();
                    return;
                }
                const cursor = cmEditor.getCursor();
                const scrollTop = cmEditor.getScrollInfo().top;
                currentDocId = doc.id;
                externalChange = false;
                localStorage.setItem('lastDocId', doc.id);
                filenameInput.value = doc.name;
                setEditorContent(doc.content);
                if (keepView) {
                    // Reloading after a save in another tab shouldn't jump the reader back to the top
                    cmEditor.setCursor(cursor);
                    cmEditor.scrollTo(null, scrollTop);
                }
                updateActiveSidebarItem();
                showStatus(status);
            };
            req.onerror = () => showStatus("Error loading document", true);
        }

        function deleteCurrent() {
            if (!currentDocId) return alert("No saved document to delete.");
            deleteDocument(currentDocId, filenameInput.value);
        }

        function deleteDocument(id, name) {
            if (!db || !confirm(`Delete "${name}" permanently?`)) return;
            const tx = db.transaction([storeName], "readwrite");
            tx.objectStore(storeName).delete(id);
            tx.oncomplete = () => {
                // Deletion was confirmed, so unsaved edits to that document are discarded too
                if (id === currentDocId) newDocument(true);
                loadDocumentList();
                notifyOtherTabs({ type: 'deleted', id });
                showStatus("Deleted");
            };
            tx.onabort = () => showStatus("Error deleting document", true);
        }

        // Ask the browser not to evict our IndexedDB data under storage pressure
        let persistRequested = false;
        function requestPersistentStorage() {
            if (persistRequested || !navigator.storage || !navigator.storage.persist) return;
            persistRequested = true;
            navigator.storage.persisted()
                .then((persisted) => persisted || navigator.storage.persist())
                .catch(() => {});
        }

        // --- 8. Import / Export ---
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            // Revoking synchronously can cancel the download in some browsers
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function downloadDocument() {
            let filename = sanitizeFilename(filenameInput.value);
            if (!filename.endsWith('.md')) filename += ".md";
            downloadBlob(new Blob([cmEditor.getValue()], { type: "text/markdown" }), filename);
        }

        // Prints the preview through a print stylesheet, giving a vector PDF with selectable text
        function exportPDF() {
            clearTimeout(renderTimeout);
            renderPreview();
            const previousTitle = document.title;
            // Browsers suggest the page title as the PDF file name
            document.title = sanitizeFilename(filenameInput.value);
            window.addEventListener('afterprint', () => { document.title = previousTitle; }, { once: true });
            window.print();
        }

        function exportBackup() {
            if (!db) return;
            const req = db.transaction([storeName], "readonly").objectStore(storeName).getAll();
            req.onsuccess = () => {
                const backup = { app: 'markdownjs', version: 1, exportedAt: new Date().toISOString(), documents: req.result };
                const date = new Date().toISOString().slice(0, 10);
                downloadBlob(new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" }), `markdown-backup-${date}.json`);
                showStatus(`Backed up ${req.result.length} document(s)`);
            };
            req.onerror = () => showStatus("Backup failed", true);
        }

        function restoreBackup(text) {
            let docs;
            try {
                docs = JSON.parse(text).documents;
            } catch (err) {
                return alert("That file is not a valid backup.");
            }
            if (!Array.isArray(docs)) return alert("That file is not a valid backup.");
            docs = docs.filter(d => d && typeof d.id === 'string' && typeof d.name === 'string'
                && typeof d.content === 'string' && typeof d.updatedAt === 'number');
            if (!docs.length) return alert("The backup contains no documents.");
            if (!confirm(`Restore ${docs.length} document(s) from this backup? Documents with newer local changes are kept.`)) return;

            const restoredIds = [];
            const tx = db.transaction([storeName], "readwrite");
            const store = tx.objectStore(storeName);
            docs.forEach(doc => {
                store.get(doc.id).onsuccess = (e) => {
                    const existing = e.target.result;
                    if (!existing || existing.updatedAt < doc.updatedAt) {
                        store.put({ id: doc.id, name: doc.name, content: doc.content, updatedAt: doc.updatedAt });
                        restoredIds.push(doc.id);
                    }
                };
            });
            tx.oncomplete = () => {
                loadDocumentList();
                notifyOtherTabs({ type: 'saved', ids: restoredIds });
                const status = `Restored ${restoredIds.length} document(s)`;
                if (restoredIds.includes(currentDocId) && !isDirty) openDocument(currentDocId, { force: true, keepView: true, status });
                else showStatus(status);
            };
            tx.onabort = () => showStatus("Restore failed", true);
        }

        function importMarkdown(fileName, text) {
            newDocument(true);
            filenameInput.value = cleanDocName(fileName.replace(/\.[^/.]+$/, ""));
            setEditorContent(text);
            // Save straight away so the import can't be lost by switching documents
            markDirty();
            saveDocument(false, "Imported");
        }

        // Drag and Drop (only for files; text dragged inside the editor is left to CodeMirror)
        const isFileDrag = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
        let dragCounter = 0;
        window.addEventListener('dragenter', (e) => {
            if (!isFileDrag(e)) return;
            e.preventDefault();
            dragCounter++;
            document.body.classList.add('drag-over');
        });
        window.addEventListener('dragleave', (e) => {
            if (!isFileDrag(e)) return;
            dragCounter = Math.max(0, dragCounter - 1);
            if (dragCounter === 0) document.body.classList.remove('drag-over');
        });
        window.addEventListener('dragover', (e) => { if (isFileDrag(e)) e.preventDefault(); });

        window.addEventListener('drop', (e) => {
            if (!isFileDrag(e)) return;
            e.preventDefault();
            dragCounter = 0;
            document.body.classList.remove('drag-over');

            const file = e.dataTransfer.files[0];
            if (!file) return;
            const isBackup = /\.json$/i.test(file.name) || file.type === 'application/json';
            const isMarkdown = /\.(md|markdown|txt)$/i.test(file.name) || file.type === 'text/markdown' || file.type === 'text/plain';

            if (!isBackup && !isMarkdown) return alert("Please drop a .md, .txt, or backup .json file");
            if (isMarkdown && isDirty && !confirm("Discard current changes to import?")) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                if (isBackup) restoreBackup(event.target.result);
                else importMarkdown(file.name, event.target.result);
            };
            reader.onerror = () => showStatus("Could not read file", true);
            reader.readAsText(file);
        });

        // --- 9. UI Polish & Theme ---
        function applyTheme(isDark) {
            document.body.classList.toggle('dark-mode', isDark);
            cmEditor.setOption("theme", isDark ? "monokai" : "default");
            // Printing always uses the light highlight theme
            document.getElementById('hljs-light').media = isDark ? 'print' : 'all';
            document.getElementById('hljs-dark').media = isDark ? 'screen' : 'not all';
        }

        function toggleDarkMode() {
            const isDark = !document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme(isDark);
        }

        function showStatus(msg, isError = false) {
            clearTimeout(statusTimeout);
            statusSpan.classList.toggle('error', isError);
            statusSpan.textContent = msg;
            statusTimeout = setTimeout(() => {
                statusSpan.textContent = "";
                statusSpan.classList.remove('error');
            }, 3000);
        }
    </script>
</body>
</html>
